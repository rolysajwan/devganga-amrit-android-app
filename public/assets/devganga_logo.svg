<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A7B38" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FBF4D9" />
      <stop offset="75%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8A6B2D" />
    </linearGradient>

    <linearGradient id="goldRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF5" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#A58038" />
      <stop offset="100%" stop-color="#6F521B" />
    </linearGradient>

    <linearGradient id="sangamBhagirathi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72A8BC" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="sangamAlaknanda" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5D6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.8" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Sacred Seal Ring -->
  <circle cx="200" cy="200" r="186" fill="none" stroke="url(#goldLinear)" stroke-width="2" opacity="0.6" />
  <circle cx="200" cy="200" r="180" fill="#061022" stroke="url(#goldLinear)" stroke-width="3" />
  <circle cx="200" cy="200" r="172" fill="none" stroke="url(#goldLinear)" stroke-width="1" stroke-dasharray="3,3" opacity="0.8" />

  <!-- Radiating Sacred Rays / Petals -->
  <g stroke="url(#goldLinear)" stroke-width="1.2" opacity="0.45">
    <line x1="200" y1="22" x2="200" y2="34" />
    <line x1="200" y1="366" x2="200" y2="378" />
    <line x1="22" y1="200" x2="34" y2="200" />
    <line x1="366" y1="200" x2="378" y2="200" />
    <line x1="74" y1="74" x2="83" y2="83" />
    <line x1="326" y1="74" x2="317" y2="83" />
    <line x1="74" y1="326" x2="83" y2="317" />
    <line x1="326" y1="326" x2="317" y2="317" />
  </g>

  <!-- Inner Meditation Mandala Border -->
  <circle cx="200" cy="200" r="148" fill="#08142C" stroke="url(#goldLinear)" stroke-width="1.5" />

  <!-- Himalayan Peaks Silhouettes -->
  <path d="M 96 210 L 140 148 L 184 210 Z" fill="#0F2448" stroke="url(#goldLinear)" stroke-width="1" />
  <path d="M 148 210 L 200 132 L 252 210 Z" fill="#142C54" stroke="url(#goldLinear)" stroke-width="1.4" />
  <path d="M 216 210 L 260 148 L 304 210 Z" fill="#0F2448" stroke="url(#goldLinear)" stroke-width="1" />

  <!-- Snow crests on mountain tops -->
  <path d="M 200 132 L 186 154 L 200 150 L 214 154 Z" fill="url(#goldRadial)" opacity="0.9" />
  <path d="M 140 148 L 129 164 L 140 160 L 151 164 Z" fill="url(#goldLinear)" opacity="0.8" />
  <path d="M 260 148 L 249 164 L 260 160 L 271 164 Z" fill="url(#goldLinear)" opacity="0.8" />

  <!-- Sacred Confluence (Sangam) Rivers meeting at Devprayag -->
  <!-- Bhagirathi from Left -->
  <path d="M 112 210 C 130 225, 175 230, 196 250 C 200 255, 200 280, 200 320" 
        fill="none" stroke="url(#sangamBhagirathi)" stroke-width="5" stroke-linecap="round" />
  <path d="M 120 215 C 138 228, 175 234, 194 252 C 197 260, 197 285, 197 320" 
        fill="none" stroke="#C5A059" stroke-width="1.5" opacity="0.8" />

  <!-- Alaknanda from Right -->
  <path d="M 288 210 C 270 225, 225 230, 204 250 C 200 255, 200 280, 200 320" 
        fill="none" stroke="url(#sangamAlaknanda)" stroke-width="5" stroke-linecap="round" />
  <path d="M 280 215 C 262 228, 225 234, 206 252 C 203 260, 203 285, 203 320" 
        fill="none" stroke="#FBF4D9" stroke-width="1.5" opacity="0.8" />

  <!-- Unified Ganga Stream (Post-Confluence) -->
  <path d="M 200 250 L 200 326" fill="none" stroke="url(#goldLinear)" stroke-width="4" stroke-linecap="round" />
  <circle cx="200" cy="250" r="4" fill="#FFFDF5" />

  <!-- Sacred Kalash / Amrit Vessel at Center-Top -->
  <g transform="translate(200, 106) scale(0.95)" filter="url(#subtleGlow)">
    <!-- Aura / Halo -->
    <circle cx="0" cy="0" r="22" fill="url(#goldRadial)" opacity="0.25" />
    
    <!-- Amrit Drops Floating -->
    <path d="M 0 -18 C -3 -12, -4 -7, -4 -4 C -4 1, -1 4, 0 4 C 1 4, 4 1, 4 -4 C 4 -7, 3 -12, 0 -18 Z" fill="url(#goldLinear)" />

    <!-- Kalash Pot Body -->
    <path d="M -12 8 C -18 14, -14 26, 0 27 C 14 26, 18 14, 12 8 Z" fill="url(#goldLinear)" />
    <!-- Kalash Neck and Rim -->
    <rect x="-9" y="5" width="18" height="4" rx="1.5" fill="#FFFDF5" />
    <path d="M -14 5 C -10 1, -4 -1, 0 -1 C 4 -1, 10 1, 14 5 Z" fill="url(#goldLinear)" />
    <!-- Coconut / Mango Leaves Motif -->
    <path d="M 0 0 C -6 -6, -8 -13, 0 -15 C 8 -13, 6 -6, 0 0 Z" fill="url(#goldRadial)" opacity="0.9" />
  </g>

  <!-- Arching Text Paths -->
  <path id="topArch" d="M 68 200 A 132 132 0 0 1 332 200" fill="none" stroke="none" />
  <path id="bottomArch" d="M 82 200 A 118 118 0 0 0 318 200" fill="none" stroke="none" />

  <!-- Top Inscription: DEVGANGA AMRIT -->
  <text font-family="'Cinzel', Georgia, serif" font-size="16.5" font-weight="700" letter-spacing="4" fill="url(#goldLinear)" text-anchor="middle">
    <textPath href="#topArch" startOffset="50%" text-anchor="middle">
      DEVGANGA AMRIT
    </textPath>
  </text>

  <!-- Bottom Inscription: DEVPRAYAG • SANGAM -->
  <text font-family="'Cinzel', Georgia, serif" font-size="10.5" font-weight="600" letter-spacing="3.5" fill="#C5A059" text-anchor="middle">
    <textPath href="#bottomArch" startOffset="50%" text-anchor="middle">
      DEVPRAYAG • SANGAM
    </textPath>
  </text>

  <!-- Decorative Stars / Lotus Dots -->
  <circle cx="70" cy="200" r="2.5" fill="url(#goldLinear)" />
  <circle cx="330" cy="200" r="2.5" fill="url(#goldLinear)" />
  <circle cx="200" cy="336" r="3" fill="url(#goldLinear)" />
</svg>
